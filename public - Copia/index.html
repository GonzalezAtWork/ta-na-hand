<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tá Na Hand!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col">

  <!-- Header / Hero Section -->
  <header class="bg-slate-800 shadow-md border-b border-slate-700 relative">
    
    <!-- Top Nav for Favorites -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6">
      <button id="btn-toggle-favs" class="flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors">
        <svg class="w-5 h-5 text-rose-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>Meus Favoritos (<span id="fav-count">0</span>)</span>
      </button>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-10 sm:px-6 lg:px-8 flex flex-col items-center">
      <!-- Written Logo -->
      <h1 class="text-5xl font-black tracking-tighter mb-8 pr-2 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-cyan-400 uppercase italic">
        Tá Na Hand!
      </h1>

      <!-- Search Component -->
      <div id="search-bar-container" class="w-full max-w-3xl flex flex-col sm:flex-row gap-2">
        <div class="relative flex-shrink-0 sm:w-48">
          <select id="category" class="w-full h-14 pl-4 pr-10 bg-slate-700 border border-slate-600 text-white font-medium rounded-xl appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <option value="esportes">⚽ Esportes</option>
            <option value="luxo">💎 Grifes & Luxo</option>
            <option value="outros">📦 Outros</option>
            <option value="todas">🌍 Todas as Lojas</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
        
        <div class="relative flex-1">
          <input type="text" id="query" class="w-full h-14 pl-5 pr-4 bg-slate-700 border border-slate-600 text-white placeholder-slate-400 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-lg">
        </div>
        
        <button id="btn-search" class="h-14 px-8 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <span>Buscar</span>
        </button>
        <button id="btn-stop" class="h-14 px-8 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 hidden">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          <span>Parar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
    
    <!-- Status / Progress -->
    <div id="status-container" class="hidden mb-10">
      <div id="logs" class="hidden"></div>
      
      <div class="bg-slate-800 rounded-2xl shadow-md border border-slate-700 p-6 flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center gap-4">
          <div class="relative w-12 h-12 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border-4 border-slate-600"></div>
            <div class="absolute inset-0 rounded-full border-4 border-indigo-500 border-t-transparent animate-spin"></div>
          </div>
          <div>
            <h3 class="font-bold text-white text-lg">Buscando catálogos...</h3>
          </div>
        </div>
        
        <div class="flex flex-wrap justify-center gap-6 md:gap-12 text-center">
          <div>
            <span class="block text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Encontrados</span>
            <span id="stat-encontrados" class="font-bold text-2xl text-emerald-400">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="results-container" class="hidden">
      
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
        <h2 id="results-title" class="text-2xl font-bold text-white">Resultados Encontrados</h2>
        
        <!-- Smart Filters -->
        <div id="filter-bar" class="flex flex-wrap gap-2">
          <button data-filter="all" class="filter-btn px-4 py-1.5 bg-indigo-600 text-white text-sm font-semibold rounded-full">Todos</button>
          <button data-filter="player" class="filter-btn px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-semibold rounded-full transition-colors">Jogador</button>
          <button data-filter="fan" class="filter-btn px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-semibold rounded-full transition-colors">Torcedor</button>
          <button data-filter="2425" class="filter-btn px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-semibold rounded-full transition-colors">Temporada 24/25</button>
        </div>
      </div>
      
      <div id="results-list" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-6">
        <!-- JS generates results here -->
      </div>
    </div>
    
  </main>

  <script>
    let evtSource = null;
    let allResults = [];
    let currentFilter = 'all';
    let showingFavorites = false;
    let favorites = JSON.parse(localStorage.getItem('tnh_favs')) || [];

    const list = document.getElementById('results-list');
    const container = document.getElementById('results-container');
    const favCount = document.getElementById('fav-count');
    
    // Inicializa contador de favoritos
    favCount.innerText = favorites.length;

    // Favoritos Toggle
    document.getElementById('btn-toggle-favs').addEventListener('click', () => {
      showingFavorites = !showingFavorites;
      if (showingFavorites) {
        document.getElementById('search-bar-container').classList.add('hidden');
        document.getElementById('status-container').classList.add('hidden');
        if (evtSource) finishSearch();
        container.classList.remove('hidden');
        document.getElementById('results-title').innerText = "Meus Favoritos";
        applyFiltersAndRender(favorites);
      } else {
        document.getElementById('search-bar-container').classList.remove('hidden');
        document.getElementById('results-title').innerText = "Resultados Encontrados";
        if (allResults.length > 0) {
          container.classList.remove('hidden');
          applyFiltersAndRender(allResults);
        } else {
          container.classList.add('hidden');
        }
      }
    });

    // Função para salvar/remover favorito
    window.toggleFav = function(link, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const isFav = favorites.find(f => f.link === link);
      if (isFav) {
        favorites = favorites.filter(f => f.link !== link);
      } else {
        // Encontra o item em allResults
        const item = allResults.find(a => a.link === link) || favorites.find(a => a.link === link);
        if (item) favorites.push(item);
      }
      localStorage.setItem('tnh_favs', JSON.stringify(favorites));
      favCount.innerText = favorites.length;
      
      // Re-render
      if (showingFavorites) applyFiltersAndRender(favorites);
      else applyFiltersAndRender(allResults);
    };

    // Filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-indigo-600', 'text-white');
          b.classList.add('bg-slate-700', 'text-slate-300');
        });
        e.target.classList.remove('bg-slate-700', 'text-slate-300');
        e.target.classList.add('bg-indigo-600', 'text-white');
        
        currentFilter = e.target.getAttribute('data-filter');
        applyFiltersAndRender(showingFavorites ? favorites : allResults);
      });
    });

    function applyFiltersAndRender(dataset) {
      let filtered = dataset;
      if (currentFilter === 'player') {
        filtered = dataset.filter(i => /jogador|player|球员|adv/i.test(i.titulo) || /jogador|player|球员|adv/i.test(i.original));
      } else if (currentFilter === 'fan') {
        filtered = dataset.filter(i => /torcedor|fan|球迷/i.test(i.titulo) || /torcedor|fan|球迷/i.test(i.original));
      } else if (currentFilter === '2425') {
        filtered = dataset.filter(i => /24\/25|24-25|2024|2025/i.test(i.titulo) || /24\/25|24-25|2024|2025/i.test(i.original));
      }
      renderAll(filtered);
    }

    document.getElementById('query').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btn-search').click();
      }
    });

    document.getElementById('btn-search').addEventListener('click', () => {
      if (showingFavorites) document.getElementById('btn-toggle-favs').click(); // Sai dos favs
      
      const query = document.getElementById('query').value;
      const category = document.getElementById('category').value;
      if (!query) return;

      document.getElementById('status-container').classList.remove('hidden');
      document.getElementById('results-container').classList.add('hidden');
      document.getElementById('logs').innerHTML = '';
      document.getElementById('results-list').innerHTML = '';
      document.getElementById('btn-search').classList.add('hidden');
      document.getElementById('btn-stop').classList.remove('hidden');
      
      const spinner = document.querySelector('.absolute.inset-0.rounded-full.border-t-transparent');
      if (spinner) spinner.classList.add('animate-spin');
      const statusTitle = document.querySelector('#status-container h3');
      if (statusTitle) statusTitle.innerText = "Buscando catálogos...";

      allResults = [];
      if (evtSource) evtSource.close();

      evtSource = new EventSource(`/api/search?q=${encodeURIComponent(query)}&c=${encodeURIComponent(category)}`);

      evtSource.addEventListener('log', (e) => {
        const log = JSON.parse(e.data);
        const logDiv = document.getElementById('logs');
        logDiv.innerHTML += `<div>${log}</div>`;
        if (log.toLowerCase().includes('erro interno')) {
          const statusTitle = document.querySelector('#status-container h3');
          if (statusTitle) statusTitle.innerText = "Erro no Servidor: Memória cheia ou Timeout!";
          alert("Ops! O servidor travou: " + log);
        }
      });

      evtSource.addEventListener('progress', (e) => {
        const p = JSON.parse(e.data);
        document.getElementById('stat-encontrados').innerText = p.encontrados;
      });

      evtSource.addEventListener('album_found', (e) => {
        container.classList.remove('hidden');
        const item = JSON.parse(e.data);
        
        const match = item.link.match(/\/albums\/(\d+)/);
        item.id = match ? parseInt(match[1], 10) : 0;
        
        // Verifica se já existe para evitar bugs visuais
        if (!allResults.find(a => a.link === item.link)) {
          allResults.push(item);
          allResults.sort((a, b) => b.id - a.id);
          applyFiltersAndRender(allResults);
        }
      });

      evtSource.addEventListener('done', (e) => {
        finishSearch();
        if (allResults.length === 0) {
           container.classList.remove('hidden');
           renderAll([]);
        }
      });

      evtSource.addEventListener('finished', () => {
        finishSearch();
      });
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
      finishSearch();
    });

    function finishSearch() {
      if (evtSource) {
        evtSource.close();
        evtSource = null;
      }
      document.getElementById('btn-search').classList.remove('hidden');
      document.getElementById('btn-stop').classList.add('hidden');
      
      const spinner = document.querySelector('.animate-spin');
      if (spinner) spinner.classList.remove('animate-spin');
      
      const statusTitle = document.querySelector('#status-container h3');
      if (statusTitle) statusTitle.innerText = "Busca Concluída";
    }

    function renderItem(item) {
      const isFav = favorites.find(f => f.link === item.link);
      const heartColor = isFav ? "text-rose-500" : "text-white/70 hover:text-white";
      const heartFill = isFav ? "currentColor" : "none";
      
      const capaImg = item.capa ? `<img src="${item.capa}" class="w-full aspect-square object-cover bg-slate-800 group-hover:scale-105 transition-transform duration-500" loading="lazy">` : `<div class="w-full aspect-square bg-slate-800 flex items-center justify-center text-slate-500 text-sm font-medium">Sem Imagem</div>`;
      
      return `
        <div class="bg-slate-800 rounded-2xl shadow-md hover:shadow-xl border border-slate-700 overflow-hidden flex flex-col group fade-in transition-all relative">
          
          <button onclick="toggleFav('${item.link}', event)" class="absolute top-2 right-2 z-10 p-2 rounded-full bg-black/30 backdrop-blur-sm ${heartColor} transition-colors">
            <svg class="w-5 h-5" fill="${heartFill}" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
          </button>

          <a href="${item.link}" target="_blank" class="relative overflow-hidden block">
            ${capaImg}
            <div class="absolute inset-0 bg-white/0 group-hover:bg-white/5 transition-colors"></div>
          </a>
          
          <div class="p-4 flex flex-col flex-1">
            <a href="${item.link}" target="_blank" class="group-hover:text-indigo-400 transition-colors">
              <h3 class="font-bold text-white text-sm leading-tight line-clamp-2 mb-1" title="${item.titulo}">${item.titulo}</h3>
            </a>
            <p class="text-slate-500 text-[10px] uppercase tracking-wide truncate mt-auto mb-3" title="${item.original}">${item.original}</p>
            
            <a href="${item.link}" target="_blank" class="w-full block text-center bg-slate-700 hover:bg-indigo-600 text-white font-medium py-2 rounded-xl transition-colors text-sm">
              Ver Catálogo
            </a>
          </div>
        </div>
      `;
    }

    function renderAll(results) {
      list.innerHTML = '';
      if (results.length === 0) {
        list.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500 text-lg">Nenhum catálogo encontrado.</div>';
        return;
      }
      results.forEach(item => {
        list.innerHTML += renderItem(item);
      });
    }
  </script>
</body>
</html>
